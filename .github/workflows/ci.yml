name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm test
      - run: npm run build -- --production

  package:
    name: Package
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: kubexplorer-vsix
          path: dist/kubexplorer.vsix
          if-no-files-found: error

  integration:
    name: Integration tests (kind, Flux, fleet)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Eight kind nodes on one runner: its default inotify limits keep the next ones from booting.
      - name: Raise the inotify limits
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512
      - name: Create the kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kubexplorer
          config: dev-cluster/kind-config.yaml
          wait: 180s
      - name: Deploy the sample workloads
        run: ./dev-cluster/setup.sh
      # Without them, the Flux, Karpenter and fleet tests are skipped.
      - name: Install Flux and a simulated Karpenter
        run: |
          ./dev-cluster/addons/flux/apply.sh
          ./dev-cluster/addons/karpenter/apply.sh
      - name: Create the mini fleet (4 single-node clusters with Flux)
        run: ./dev-cluster/fleet/setup.sh
      - name: Run the integration tests
        run: xvfb-run -a npm run test:integration
