name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  # actions: read is required by CodeQL on private repositories.
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning is only available on public repositories (or with GitHub Advanced Security).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
