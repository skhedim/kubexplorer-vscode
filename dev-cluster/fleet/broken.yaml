# Only on fleet-dev-2: a Kustomization whose path does not exist (failing, and missing on fleet-dev-1).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: redis, namespace: flux-system }
spec:
  interval: 5m
  sourceRef: { kind: GitRepository, name: podinfo }
  path: ./deploy/redis-does-not-exist
  prune: true
