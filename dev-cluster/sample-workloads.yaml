# Sample workloads for the development cluster (applied by dev-cluster/setup.sh).
# They cover every state the UI renders: healthy, multi-container, CrashLoopBackOff, Pending, completed Jobs, etc.
apiVersion: v1
kind: Namespace
metadata: { name: frontend }
---
apiVersion: v1
kind: Namespace
metadata: { name: payments }
---
apiVersion: v1
kind: Namespace
metadata: { name: monitoring }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: web-app-config, namespace: frontend }
data:
  APP_ENV: production
  FEATURE_FLAGS: "new-checkout,dark-mode"
  nginx.conf: |
    server { listen 80; location / { return 200 'ok'; } }
---
apiVersion: v1
kind: Secret
metadata: { name: payments-db, namespace: payments }
type: Opaque
stringData:
  username: payments
  password: not-a-real-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: frontend
  labels: { app.kubernetes.io/name: web-app, app.kubernetes.io/part-of: shop }
spec:
  replicas: 3
  selector: { matchLabels: { app.kubernetes.io/name: web-app } }
  template:
    metadata: { labels: { app.kubernetes.io/name: web-app, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ name: http, containerPort: 80 }]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
        - name: log-shipper
          image: busybox:1.36
          command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo \"level=info msg=\\\"shipped batch $i\\\"\"; sleep 3; done"]
---
apiVersion: v1
kind: Service
metadata: { name: web-app, namespace: frontend }
spec:
  selector: { app.kubernetes.io/name: web-app }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
  labels: { app.kubernetes.io/name: payments-api }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: payments-api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: payments-api } }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              i=0
              while true; do
                i=$((i+1))
                echo "level=info msg=\"POST /api/v1/payments 201\" latency_ms=$((i % 90 + 10))"
                [ $((i % 7)) -eq 0 ] && echo "level=warn msg=\"slow upstream: bank-gateway\" latency_ms=812"
                [ $((i % 13)) -eq 0 ] && echo "level=error msg=\"card declined\" code=51"
                sleep 2
              done
          resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: payments-api, namespace: payments }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: payments-api }
  ports: [{ name: grpc, port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-scorer
  namespace: payments
  labels: { app.kubernetes.io/name: fraud-scorer }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: fraud-scorer } }
  template:
    metadata: { labels: { app.kubernetes.io/name: fraud-scorer } }
    spec:
      containers:
        - name: scorer
          image: busybox:1.36
          command: ["sh", "-c", "echo 'loading model /models/scorer.onnx'; sleep 2; echo 'ERROR model not found' >&2; exit 1"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-worker
  namespace: payments
  labels: { app.kubernetes.io/name: ledger-worker }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: ledger-worker } }
  template:
    metadata: { labels: { app.kubernetes.io/name: ledger-worker } }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "infinity"]
          # Deliberately unschedulable: stays Pending.
          resources: { requests: { memory: 512Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: monitoring }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: monitoring
spec:
  serviceName: redis
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ name: redis, containerPort: 6379 }]
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: monitoring
spec:
  selector: { matchLabels: { app.kubernetes.io/name: node-agent } }
  template:
    metadata: { labels: { app.kubernetes.io/name: node-agent } }
    spec:
      tolerations: [{ operator: Exists }]
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"level=info msg=\\\"node metrics collected\\\" node=$NODE\"; sleep 10; done"]
          env: [{ name: NODE, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: invoice-export
  namespace: payments
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: export
              image: busybox:1.36
              command: ["sh", "-c", "echo exporting invoices; sleep 5; echo done"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: web-app, namespace: frontend }
spec:
  rules:
    - host: shop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web-app, port: { name: http } } }
