# Karpenter objects of the development cluster. There is no Karpenter controller: kwok simulates the nodes
# (annotation kwok.x-k8s.io/node=fake) and apply.sh patches realistic statuses on NodePools and NodeClaims.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata: { name: default }
spec:
  role: KarpenterNodeRole-dev
  amiSelectorTerms: [{ alias: al2023@latest }]
  subnetSelectorTerms: [{ tags: { karpenter.sh/discovery: dev } }]
  securityGroupSelectorTerms: [{ tags: { karpenter.sh/discovery: dev } }]
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata: { name: gpu }
spec:
  role: KarpenterNodeRole-dev
  amiSelectorTerms: [{ alias: bottlerocket@latest }]
  subnetSelectorTerms: [{ tags: { karpenter.sh/discovery: dev } }]
  securityGroupSelectorTerms: [{ tags: { karpenter.sh/discovery: dev } }]
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata: { name: default }
spec:
  weight: 10
  template:
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: default }
      expireAfter: 720h
      taints: [{ key: kwok.x-k8s.io/node, value: fake, effect: NoSchedule }]
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r] }
        - { key: kubernetes.io/arch, operator: In, values: [amd64] }
  limits: { cpu: "32", memory: 128Gi }
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets: [{ nodes: "10%" }]
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata: { name: gpu }
spec:
  template:
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: gpu }
      taints:
        - { key: nvidia.com/gpu, value: "true", effect: NoSchedule }
        - { key: kwok.x-k8s.io/node, value: fake, effect: NoSchedule }
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: [on-demand] }
        - { key: karpenter.k8s.aws/instance-family, operator: In, values: [g5] }
  limits: { cpu: "16", memory: 64Gi, nvidia.com/gpu: "4" }
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
---
# Simulated nodes (kwok marks them Ready and runs the pods scheduled on them).
apiVersion: v1
kind: Node
metadata:
  name: ip-10-0-1-21.eu-west-3.compute.internal
  annotations: { kwok.x-k8s.io/node: fake }
  labels:
    type: kwok
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux
    kubernetes.io/hostname: ip-10-0-1-21.eu-west-3.compute.internal
    karpenter.sh/nodepool: default
    karpenter.sh/capacity-type: on-demand
    karpenter.sh/registered: "true"
    karpenter.sh/initialized: "true"
    karpenter.k8s.aws/instance-category: m
    karpenter.k8s.aws/instance-family: m5
    node.kubernetes.io/instance-type: m5.large
    topology.kubernetes.io/region: eu-west-3
    topology.kubernetes.io/zone: eu-west-3a
spec:
  providerID: aws:///eu-west-3a/i-0a1b2c3d4e5f60001
  taints: [{ key: kwok.x-k8s.io/node, value: fake, effect: NoSchedule }]
status:
  capacity: { cpu: "2", memory: 8Gi, pods: "29", ephemeral-storage: 20Gi }
  allocatable: { cpu: 1930m, memory: 7Gi, pods: "29", ephemeral-storage: 18Gi }
