---
# Workloads running on the simulated nodes.
apiVersion: v1
kind: Namespace
metadata: { name: batch }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: inflate, namespace: batch }
spec:
  replicas: 6
  selector: { matchLabels: { app: inflate } }
  template:
    metadata: { labels: { app: inflate } }
    spec:
      nodeSelector: { karpenter.sh/nodepool: default }
      tolerations: [{ key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule }]
      containers:
        - name: inflate
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.7
          resources: { requests: { cpu: 500m, memory: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: inference, namespace: batch }
spec:
  replicas: 1
  selector: { matchLabels: { app: inference } }
  template:
    metadata: { labels: { app: inference } }
    spec:
      nodeSelector: { karpenter.sh/nodepool: gpu }
      tolerations:
        - { key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule }
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      containers:
        - name: model
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.7
          resources: { requests: { cpu: "2", memory: 8Gi }, limits: { nvidia.com/gpu: "1" } }
